# Self-hosted extraction model on one GPU.
#   Option A (default): merged fine-tuned weights at ./runs/vidoc-merged
#   Option B: base model + LoRA adapter, uncomment the lora lines and comment out the merged model
services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    command:
      - /models/vidoc-merged
      - --served-model-name
      - vidoc
      # - Qwen/Qwen2.5-VL-3B-Instruct
      # - --enable-lora
      # - --lora-modules
      # - vidoc=/models/vidoc-lora
      # - --max-lora-rank
      # - "16"
      - --max-model-len
      - "8192"
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "32"
    volumes:
      - ../runs:/models:ro
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ports: ["8001:8000"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      retries: 60
      start_period: 120s
