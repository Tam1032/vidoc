[project]
name = "vidoc"
version = "0.1.0"
description = "Vietnamese invoice extraction (fine-tuned VLM on vLLM) and an expense-claim agent over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.4", "torchvision", "transformers>=4.49", "peft>=0.13", "accelerate>=1.0", "bitsandbytes>=0.44", "mlflow>=2.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vidoc*"]
